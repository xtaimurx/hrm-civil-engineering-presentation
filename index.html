<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Human Resource Management in Civil Engineering</title>
  <style>
    :root {
      --bg: #07090e;
      --panel: #0e131d;
      --panel-hi: #141c2b;
      --ivory: #f4f0e8;
      --muted: #a8b0be;
      --gold: #e0a93e;
      --gold-soft: rgba(224, 169, 62, 0.26);
      --orange: #ff7a1a;
      --serif: "Georgia", "Liberation Serif", "Times New Roman", serif;
      --sans: "Inter", "Helvetica Neue", "Calibri", system-ui, sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ivory);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(1200px 800px at 50% 45%, rgba(22, 34, 56, 0.45), transparent 75%),
        var(--bg);
    }

    #world {
      position: absolute;
      left: 0;
      top: 0;
      width: 9600px;
      height: 7600px;
      transform-origin: 0 0;
      will-change: transform;
      background-image:
        linear-gradient(rgba(180, 205, 245, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 205, 245, 0.045) 1px, transparent 1px),
        linear-gradient(rgba(224, 169, 62, 0.07) 2px, transparent 2px),
        linear-gradient(90deg, rgba(224, 169, 62, 0.07) 2px, transparent 2px);
      background-size: 80px 80px, 80px 80px, 400px 400px, 400px 400px;
    }

    .tower-monument {
      position: absolute;
      left: 3500px;
      top: 450px;
      width: 2600px;
      height: 4225px;
      background: #090c12;
      border: 3px solid rgba(224, 169, 62, 0.55);
      box-shadow: 0 80px 240px rgba(0, 0, 0, 0.92), 0 0 120px rgba(224, 169, 62, 0.12);
      overflow: hidden;
    }

    .tower-monument img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: contrast(1.12) brightness(0.92);
    }

    .tower-monument-vignette {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(7, 9, 14, 0.35) 0%,
        rgba(7, 9, 14, 0.08) 45%,
        rgba(7, 9, 14, 0.55) 88%,
        rgba(7, 9, 14, 0.92) 100%);
    }

    .tower-poster-header {
      position: absolute;
      left: 90px;
      right: 90px;
      top: 80px;
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid rgba(224, 169, 62, 0.5);
      padding-bottom: 28px;
      font-family: var(--mono);
      font-size: 28px;
      letter-spacing: 0.08em;
    }

    .tower-poster-header span { color: var(--gold); }

    .tower-poster-footer {
      position: absolute;
      left: 90px;
      right: 90px;
      bottom: 90px;
      padding-top: 36px;
      border-top: 2px solid rgba(224, 169, 62, 0.55);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .tower-poster-footer h2 {
      font-family: var(--serif);
      font-size: 88px;
      font-weight: 400;
      line-height: 1.05;
    }

    .tower-poster-footer p {
      font-size: 34px;
      color: var(--gold);
      margin-top: 12px;
    }

    .tower-poster-stats { display: flex; gap: 64px; text-align: right; }

    .tower-poster-stats .num {
      font-family: var(--serif);
      font-size: 76px;
      color: var(--gold);
      line-height: 1;
    }

    .tower-poster-stats .lbl { font-size: 24px; margin-top: 8px; }

    #callout-svg {
      position: absolute;
      left: 0;
      top: 0;
      width: 9600px;
      height: 7600px;
      pointer-events: none;
      z-index: 4;
    }

    .callout-base {
      fill: none;
      stroke: rgba(224, 169, 62, 0.24);
      stroke-width: 4;
      stroke-dasharray: 14 12;
    }

    .callout-active {
      fill: none;
      stroke: var(--gold);
      stroke-width: 7;
      stroke-linecap: round;
      filter: drop-shadow(0 0 18px rgba(224, 169, 62, 0.8));
    }

    .anchor-node {
      fill: var(--bg);
      stroke: var(--gold);
      stroke-width: 6;
    }

    .scene {
      position: absolute;
      width: 1600px;
      height: 900px;
      margin-left: -800px;
      margin-top: -450px;
      background: var(--panel);
      border: 2px solid rgba(224, 169, 62, 0.38);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      z-index: 6;
    }

    .scene.is-active { border-color: var(--gold); z-index: 10; }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--gold);
      border-style: solid;
      pointer-events: none;
      z-index: 20;
    }

    .scene::before { top: 16px; left: 16px; border-width: 2px 0 0 2px; }
    .scene::after { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

    .anim-item { opacity: 1; }

    .kicker {
      font-family: var(--mono);
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .headline {
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 400;
      line-height: 1.08;
      color: var(--ivory);
      letter-spacing: -0.015em;
      margin-bottom: 20px;
    }

    .dek {
      font-size: 22px;
      line-height: 1.45;
      color: var(--muted);
      max-width: 48ch;
    }

    /* Opening morph (scenes 1 and 2 share one box) */
    .morph-stage { position: relative; width: 100%; height: 100%; background: var(--bg); }

    .morph-photo {
      position: absolute;
      left: 0;
      top: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75);
    }

    .morph-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .morph-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(7, 9, 14, 0.90) 0%,
        rgba(7, 9, 14, 0.68) 52%,
        rgba(7, 9, 14, 0.20) 100%);
    }

    .morph-question-layer {
      position: absolute;
      left: 88px;
      top: 0;
      bottom: 0;
      width: 960px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 3;
    }

    .morph-question-layer .headline { font-size: 68px; margin-bottom: 24px; }

    .morph-reveal-layer {
      position: absolute;
      left: 740px;
      right: 76px;
      top: 68px;
      bottom: 68px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 3;
      opacity: 0;
    }

    .giant-five {
      font-family: var(--serif);
      font-size: 156px;
      line-height: 0.92;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .morph-reveal-layer .headline { font-size: 40px; margin-bottom: 16px; }

    .morph-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--gold-soft);
    }

    .morph-metric-card {
      background: var(--panel-hi);
      border: 1px solid rgba(244, 240, 232, 0.14);
      padding: 18px 20px;
    }

    .morph-metric-card .val {
      font-family: var(--serif);
      font-size: 32px;
      color: var(--gold);
      margin-bottom: 6px;
    }

    .morph-metric-card .lbl { font-size: 15px; line-height: 1.35; }

    /* Cinema title */
    .cinema-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 76px 84px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .cinema-bg { position: absolute; inset: 0; z-index: 0; }
    .cinema-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .cinema-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(7, 9, 14, 0.84) 0%,
        rgba(7, 9, 14, 0.62) 48%,
        rgba(7, 9, 14, 0.94) 100%);
    }

    .cinema-top { position: relative; z-index: 2; max-width: 1120px; }
    .cinema-top .headline { font-size: 62px; }

    .cinema-pillars {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      padding-top: 28px;
      border-top: 1px solid rgba(224, 169, 62, 0.45);
    }

    .cinema-pillar {
      background: rgba(14, 19, 29, 0.84);
      border: 1px solid rgba(244, 240, 232, 0.14);
      padding: 22px 24px;
    }

    .cinema-pillar h3 {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 400;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .cinema-pillar p { font-size: 17px; line-height: 1.42; }

    /* Split editorial */
    .split-wrap { width: 100%; height: 100%; display: grid; grid-template-columns: 44% 56%; }
    .split-wrap.side-right { grid-template-columns: 56% 44%; }
    .split-photo { position: relative; height: 100%; overflow: hidden; background: #05070b; }
    .split-wrap.side-right .split-photo { order: 2; }
    .split-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .split-copy {
      padding: 64px 68px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .split-copy .headline { font-size: 44px; margin-bottom: 14px; }
    .split-copy .dek { font-size: 18px; margin-bottom: 24px; }

    .card-stack { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .card-stack.two-col { grid-template-columns: 1fr 1fr; gap: 16px; }

    .ed-card {
      background: var(--panel-hi);
      border: 1px solid rgba(244, 240, 232, 0.14);
      padding: 16px 20px;
    }

    .ed-card .tag { font-family: var(--mono); font-size: 13px; color: var(--gold); margin-bottom: 4px; }
    .ed-card h4 { font-family: var(--serif); font-size: 20px; font-weight: 400; margin-bottom: 6px; }
    .ed-card p { font-size: 15px; line-height: 1.38; color: var(--muted); }

    /* Matrix (8 functions, 7 challenges) */
    .matrix-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 64px 76px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .matrix-bg { position: absolute; inset: 0; opacity: 0.16; z-index: 0; }
    .matrix-bg img { width: 100%; height: 100%; object-fit: cover; }
    .matrix-header { position: relative; z-index: 2; }

    .matrix-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 20px;
      height: 560px;
    }

    .matrix-cell {
      background: rgba(20, 28, 43, 0.92);
      border: 1px solid rgba(244, 240, 232, 0.14);
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .matrix-cell .num { font-family: var(--mono); font-size: 16px; color: var(--gold); }

    .matrix-cell h3 {
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 400;
      margin: 10px 0 8px;
    }

    .matrix-cell p { font-size: 16px; line-height: 1.4; color: var(--muted); }

    /* Life cycle: seven stage columns, sized to content, vertically centred */
    .lifecycle-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 72px 68px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 56px;
    }

    .lifecycle-track {
      position: relative;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 14px;
      padding-top: 26px;
    }

    .lifecycle-track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--orange));
    }

    .stage-node {
      background: rgba(20, 28, 43, 0.92);
      border: 1px solid rgba(224, 169, 62, 0.28);
      padding: 20px 16px 24px;
    }

    .stage-node .num { font-family: var(--mono); font-size: 15px; color: var(--gold); margin-bottom: 10px; }
    .stage-node h3 { font-family: var(--serif); font-size: 21px; font-weight: 400; margin-bottom: 12px; }
    .stage-node p { font-size: 15px; line-height: 1.4; color: var(--muted); }

    /* Pillars: sized to content */
    .pillars-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 72px 76px;
      display: flex;
      flex-direction: column;
      gap: 44px;
    }

    .pillars-bg { position: absolute; inset: 0; opacity: 0.12; z-index: 0; filter: blur(2px); }
    .pillars-bg img { width: 100%; height: 100%; object-fit: cover; }
    .pillars-header { position: relative; z-index: 2; }

    .pillars-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .pillar-col {
      background: rgba(20, 28, 43, 0.94);
      border: 1px solid rgba(244, 240, 232, 0.14);
      padding: 28px 22px 30px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .pillar-col .metric { font-family: var(--mono); font-size: 14px; color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; }
    .pillar-col h3 { font-family: var(--serif); font-size: 26px; font-weight: 400; line-height: 1.15; }
    .pillar-col p { font-size: 16px; line-height: 1.45; color: var(--muted); }

    /* Recommendations */
    .recs-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 28px;
      margin-top: 12px;
    }

    .rec-item {
      background: rgba(14, 19, 29, 0.88);
      border: 1px solid rgba(244, 240, 232, 0.14);
      padding: 18px 22px;
      font-size: 18px;
      line-height: 1.35;
    }

    .finale-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 110px;
    }

    .finale-wrap .headline { font-size: 80px; }

    #hud {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 14, 22, 0.88);
      border: 1px solid rgba(224, 169, 62, 0.4);
      padding: 8px 18px;
      font-family: var(--mono);
      font-size: 13px;
    }

    body.hide-hud #hud { opacity: 0; pointer-events: none; }

    #hud button {
      background: none;
      border: 1px solid rgba(224, 169, 62, 0.3);
      color: var(--ivory);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
    }

    #hud button:hover, #hud button.active {
      background: var(--gold);
      color: var(--bg);
      border-color: var(--gold);
    }

    #scene-counter { min-width: 64px; text-align: center; color: var(--gold); font-weight: 600; }
  </style>

  <style id="engine-v6">
    .state-layer {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .state-layer.is-on {
      display: block;
      pointer-events: auto;
    }

    /* Persistent media primitive inside each .scene (never inside display:none) */
    .pane-media,
    .pane-media-sub {
      position: absolute;
      left: 0;
      top: 0;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      z-index: 0;
      background: #05070b;
      will-change: left, top, width, height, transform;
    }
    .pane-media-sub {
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      border-top: 1px solid rgba(244, 240, 232, 0.18);
    }
    .pane-img,
    .pane-sub-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform-origin: center center;
      will-change: transform, filter, opacity;
    }
    .pane-scrim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transition: background 600ms ease, opacity 600ms ease;
    }

    /* Hide duplicate static <img> elements and opaque backgrounds inside state-layers
       so the persistent .pane-media primitive is the single moving image across states! */
    .scene:not(#scene-1) .state-layer img {
      display: none !important;
    }
    .scene:not(#scene-1) .s04-cover,
    .scene:not(#scene-1) .s04-photo,
    .scene:not(#scene-1) .s06-cover,
    .scene:not(#scene-1) .s06-photo,
    .scene:not(#scene-1) .s07-banner,
    .scene:not(#scene-1) .s08-cover,
    .scene:not(#scene-1) .s08-split,
    .scene:not(#scene-1) .s08-strip,
    .scene:not(#scene-1) .s09-cover-photo,
    .scene:not(#scene-1) .s09-photo,
    .scene:not(#scene-1) .s10-cover,
    .scene:not(#scene-1) .s11-cover,
    .scene:not(#scene-1) .s11-duties,
    .scene:not(#scene-1) .s12-proof,
    .scene:not(#scene-1) .s12-rail,
    .scene:not(#scene-1) .s12-main,
    .scene:not(#scene-1) .s12-sub,
    .scene:not(#scene-1) .s14-wrap,
    .scene:not(#scene-1) .fin15 {
      background: transparent !important;
    }

    /* State 32 Full-Canvas Finale: animated golden energy pulses along callout pipes */
    .callout-pulse {
      fill: none;
      stroke: var(--gold);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 220 480;
      opacity: 0;
      filter: drop-shadow(0 0 22px rgba(224, 169, 62, 0.95));
      transition: opacity 600ms ease;
    }
    body.is-canvas-finale .callout-pulse {
      opacity: 1;
      animation: pipePulse 2.4s linear infinite;
    }
    body.is-canvas-finale .callout-base {
      stroke: rgba(224, 169, 62, 0.55);
      stroke-width: 5;
    }
    body.is-canvas-finale .anchor-node {
      fill: var(--gold);
      filter: drop-shadow(0 0 24px rgba(224, 169, 62, 1));
    }
    @keyframes pipePulse {
      from { stroke-dashoffset: 700; }
      to { stroke-dashoffset: 0; }
    }

    [data-depth] { will-change: transform; }
    @keyframes kbDrift { from { transform: scale(1.04); } to { transform: scale(1.11); } }
    .kb { animation: kbDrift 18s ease-in-out infinite alternate; }
    body.is-flying .kb { animation-play-state: paused; }
  </style>
</head>
<body>

  <div id="viewport">
    <div id="world">
      <svg id="callout-svg" viewBox="0 0 9600 7600">
        <g id="callout-lines"></g>
        <path id="active-beam" class="callout-active" d="" />
      </svg>

      <div class="tower-monument" id="tower-centerpiece">
        <img src="assets/tower_full.jpg" alt="Empire State Building" />
        <div class="tower-monument-vignette"></div>
        <div class="tower-poster-header">
          <div>Architectural spine, <span>New York, 1930 to 1931</span></div>
          <div>Human resource management in civil engineering</div>
        </div>
        <div class="tower-poster-footer">
          <div>
            <h2>The Empire State Building</h2>
            <p>Built by about 3,400 coordinated workers in 410 days</p>
          </div>
          <div class="tower-poster-stats">
            <div><div class="num">102</div><div class="lbl">Floors</div></div>
            <div><div class="num">410</div><div class="lbl">Days</div></div>
          </div>
        </div>
      </div>

      <div id="scenes-layer"></div>
    </div>
  </div>

  <footer id="hud">
    <button type="button" id="btn-prev">← Prev</button>
    <span id="scene-counter">Start</span>
    <button type="button" id="btn-next">Next →</button>
    <button type="button" id="btn-sound">Sound: Off (M)</button>
  </footer>
