<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Resource Management in Civil Engineering</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{
    --sky:#05070f; --panel:rgba(6,9,20,.92); --ivory:#f5eee2; --mute:#aeacb8; --amber:#f0b458; --amber-lo:rgba(240,180,88,.32); --hair:rgba(245,238,226,.13);
    --serif:"Instrument Serif",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;user-select:none}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:var(--sky);color:var(--ivory);font-family:var(--sans)}

  /* ── tower: the only big image, moved by transform alone ── */
  #tower{position:absolute;left:0;top:0;width:1600px;height:2600px;transform-origin:0 0;will-change:transform}
  #tower img{display:block;width:1600px;height:2600px;-webkit-mask-image:linear-gradient(90deg,transparent 4%,#000 30%,#000 70%,transparent 96%);mask-image:linear-gradient(90deg,transparent 4%,#000 30%,#000 70%,transparent 96%)}
  #tower .beacon{position:absolute;left:701px;top:20px;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:radial-gradient(#fff3d6,rgba(240,180,88,0) 70%);opacity:0}
  .lit #tower .beacon{animation:beacon 2.6s ease-in-out infinite}
  @keyframes beacon{50%{opacity:1}}

  /* ── panes: only the current one (and the one leaving) is visible ── */
  .pane{position:absolute;left:0;top:0;width:1240px;height:960px;transform-origin:0 0;visibility:hidden;opacity:0;transition:opacity .55s ease;background:var(--panel);border-top:2px solid var(--amber);overflow:hidden}
  .pane.vis{visibility:visible}
  .pane.on{opacity:1;transition:opacity .6s ease .25s}
  .pane.bare{background:none;border:0;overflow:visible}
  .ph{position:absolute;inset:0;opacity:.12;transition:opacity .9s ease}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pane.at-cover .ph{opacity:1}
  .pane.at-cover.on .ph img{animation:kb 18s ease-in-out infinite alternate}
  @keyframes kb{to{transform:scale(1.07)}}
  .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,15,.94) 0,rgba(5,7,15,.55) 38%,rgba(5,7,15,0) 70%);opacity:0;transition:opacity .9s}
  .pane.at-cover .shade{opacity:1}

  .st{position:absolute;inset:0;padding:60px 80px 64px;visibility:hidden;display:flex;flex-direction:column;justify-content:center}
  .st.on{visibility:visible}
  .st .in{opacity:0}
  .st.on .in{animation:in .75s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 80ms)}
  @keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .st.cover{justify-content:flex-end;padding-bottom:80px}

  .k{font-size:18px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--amber)}
  .count{font-size:16px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:14px}
  h1{font-family:var(--serif);font-weight:400;font-size:116px;line-height:.98;letter-spacing:-.01em;margin-top:22px}
  h2{font-family:var(--serif);font-weight:400;font-size:74px;line-height:1.03;letter-spacing:-.005em;margin-top:16px;max-width:1080px}
  .cover h2{font-size:98px;line-height:1;max-width:1000px}
  .dek{font-size:27px;line-height:1.5;color:var(--mute);margin-top:20px;font-weight:300;max-width:1060px}
  .who{margin-top:52px;font-size:17px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
  .who b{color:var(--ivory);font-weight:500}

  .grid{display:grid;gap:40px 50px;margin-top:44px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .card{border-top:1px solid var(--amber-lo);padding-top:20px}
  .card .num{font-family:var(--serif);font-style:italic;font-size:48px;line-height:1;color:var(--amber)}
  .card .tag{font-size:15px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
  .card h3{font-weight:600;font-size:29px;line-height:1.25;margin-top:12px}
  .card p{font-size:23px;line-height:1.45;color:var(--mute);margin-top:8px;font-weight:300}
  .card.hi{border-top:2px solid var(--amber)}
  .card.hi h3{font-family:var(--serif);font-weight:400;font-size:40px}
  .card.hi p{color:var(--ivory)}
  .card.wide{grid-column:1/-1}
  .tag sup{font-size:.7em;vertical-align:.5em;letter-spacing:0}

  .rows{margin-top:34px}
  .row{display:grid;grid-template-columns:90px 1fr;align-items:baseline;padding:22px 0;border-top:1px solid var(--hair)}
  .row .num{font-family:var(--serif);font-style:italic;font-size:44px;color:var(--amber);line-height:1}
  .row p{font-size:30px;line-height:1.35}
  .ledger .row{grid-template-columns:76px 150px 320px 1fr;gap:0 10px}
  .ledger .metric{font-size:16px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}
  .ledger h3{font-weight:600;font-size:27px}
  .ledger p{font-size:23px;color:var(--mute);font-weight:300;line-height:1.45}

  .five-row{display:flex;align-items:flex-end;gap:28px;margin-top:40px}
  .five{font-family:var(--serif);font-style:italic;font-size:300px;line-height:.74;color:var(--amber)}
  .five-note{font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);padding-bottom:16px;max-width:200px;line-height:1.6}
  .metrics{display:flex;margin-top:40px}
  .metrics div{flex:1;border-left:1px solid var(--amber-lo);padding:2px 24px}
  .metrics div:first-child{border-left:0;padding-left:0}
  .metrics b{display:block;font-family:var(--serif);font-weight:400;font-size:60px;line-height:1.1}
  .metrics span{display:block;font-size:19px;color:var(--mute);margin-top:4px}

  .chips{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .chips span{font-size:16px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;background:rgba(240,180,88,.1);color:var(--ivory)}

  /* life cycle track */
  .track{position:relative;margin-top:56px;display:grid;gap:0 30px}
  .track::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--amber-lo)}
  .node{position:relative;padding-top:40px}
  .node::before{content:"";position:absolute;left:0;top:4px;width:11px;height:11px;border-radius:50%;background:var(--amber)}
  .node .num{font-family:var(--serif);font-style:italic;font-size:46px;color:var(--amber);line-height:1}
  .node h3{font-weight:600;font-size:28px;margin-top:10px}
  .node p{font-size:22px;line-height:1.5;color:var(--mute);margin-top:8px;font-weight:300}
  .done-stages{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}
  .done-stages span{font-size:18px;color:var(--mute);padding:8px 14px;border-top:1px solid var(--hair);opacity:.75}
  .done-stages i{font-family:var(--serif);color:var(--amber);font-size:20px;margin-right:8px}

  .refs .card h3{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.15}

  /* finale */
  .fin h1{font-size:160px;margin-top:26px}
  .feats{margin-top:80px;max-width:520px;border-top:1px solid var(--amber-lo);padding-top:20px}
  .feats h3{font-size:16px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
  .feats li{list-style:none;font-size:23px;color:var(--mute);padding:9px 0;border-bottom:1px solid var(--hair)}

  /* ── overview ── */
  #ov{position:absolute;inset:0;pointer-events:none;visibility:hidden}
  .ov #ov{visibility:visible}
  .mc{position:absolute;width:330px;height:118px;overflow:hidden;opacity:0;background:#0b0e1a}
  .mc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
  .mc::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,7,15,.92),rgba(5,7,15,.1) 75%)}
  .mc div{position:absolute;left:14px;right:14px;bottom:10px;z-index:1;font-family:var(--serif);font-size:19px;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mc b{display:block;font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;margin-bottom:4px}
  .mc .ld{position:absolute;top:58px;height:1px;width:0;background:var(--amber-lo)}
  .lead{position:absolute;height:1px;background:linear-gradient(90deg,var(--amber),var(--amber-lo));opacity:0;transform-origin:0 0}
  .ov .mc{animation:mc .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d) * 70ms + 900ms)}
  .ov .lead{animation:fade .6s both;animation-delay:calc(var(--d) * 70ms + 1200ms)}
  @keyframes mc{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  .ov-title{position:absolute;left:0;right:0;bottom:46px;text-align:center;opacity:0}
  .ov .ov-title{animation:fade .8s both 1.6s}
  .ov-title h2{font-size:58px;margin:10px auto 0}

  /* ── chrome ── */
  .hud{position:absolute;left:30px;bottom:26px;background:rgba(5,7,15,.85);padding:8px 16px 10px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);z-index:5;transition:opacity .4s}
  .hud b{font-family:var(--serif);font-size:30px;letter-spacing:0;color:var(--amber);font-weight:400;margin-right:10px}
  .counter{position:absolute;right:30px;bottom:30px;font-size:13px;letter-spacing:.2em;color:#6d6b78;z-index:5;transition:opacity .4s}
  .ov .hud,.ov .counter{opacity:0}
  .nohud .hud,.nohud .counter{opacity:0}
  #boot{position:absolute;inset:0;background:var(--sky);z-index:20;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#6d6b78;transition:opacity .6s}
  .ready #boot{opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="tower"><img src="img/tower.jpg" width="1600" height="2600" alt="Empire State Building"><div class="beacon"></div></div>
  <div id="panes"></div>
  <div id="ov"><div class="ov-title"><div class="k" id="ovK"></div><h2 id="ovT"></h2></div></div>
  <div class="hud"><b id="floor">1</b>floor</div>
  <div class="counter" id="counter"></div>
  <div id="boot">Loading</div>
</div>
<script src="scenes.js"></script>
<script src="extras.js"></script>
<script src="deck.js"></script>
</body>
</html>
